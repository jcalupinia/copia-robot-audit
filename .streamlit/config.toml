[server]
headless = true

[browser]
gatherUsageStats = false

# Tema oscuro: hace que los componentes nativos de Streamlit (date pickers,
# selects, menús) rendericen en oscuro y coincidan con el rediseño
# glassmorphism del CSS de aplicacion.py.
[theme]
base = "dark"
primaryColor = "#5b8cff"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#141a2e"
textColor = "#e9edf6"
font = "sans serif"
